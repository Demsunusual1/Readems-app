name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: readems
          POSTGRES_USER: readems
          POSTGRES_PASSWORD: readems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readems -d readems"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://readems:readems@localhost:5432/readems?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Show exact Prettier diff
        run: |
          npx prettier --write e2e/discover.spec.ts e2e/reading-flow.spec.ts "src/app/story/[id]/chapter/[chapter]/page.tsx" src/components/reading-progress-tracker.tsx src/lib/reading.ts
          git diff -- e2e/discover.spec.ts e2e/reading-flow.spec.ts "src/app/story/[id]/chapter/[chapter]/page.tsx" src/components/reading-progress-tracker.tsx src/lib/reading.ts
          exit 1
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-browser-results
          path: test-results/
          retention-days: 7
