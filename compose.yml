services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: readems
      POSTGRES_USER: readems
      POSTGRES_PASSWORD: readems
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U readems -d readems']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
