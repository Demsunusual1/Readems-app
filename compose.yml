services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: readems
      POSTGRES_USER: readems
      POSTGRES_PASSWORD: readems
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U readems -d readems']
      interval: 5s
      timeout: 5s
      retries: 10

  # The full stack, for running Readems the way it is deployed. Start it with
  # `docker compose --profile app up --build`; plain `docker compose up -d`
  # brings up only the database, which is what local development needs.
  migrate:
    profiles: ['app']
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://readems:readems@postgres:5432/readems?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    profiles: ['app']
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://readems:readems@postgres:5432/readems?schema=public
      NODE_ENV: production
      # Whoever is listed here becomes a super admin when they sign in. Empty
      # by default, so a deployment has to say who runs it.
      READEMS_ADMIN_EMAILS: ${READEMS_ADMIN_EMAILS:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
